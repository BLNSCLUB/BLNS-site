<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BENGAL | Late Night Sessions</title>

<style>

body{
    background-image:url('background.jpg');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    background-color:black;
    color:white;
    text-align:center;
    font-family:Georgia,serif;
    margin:0;
    padding-top:35px;
}

.logo{
    width:min(350px,70vw);
    opacity:0.9;
}

.subtitle{
    font-size:clamp(11px,1.5vw,18px);
    letter-spacing:.3em;
    color:#cccccc;
    opacity:.9;
    margin-top:10px;
    margin-bottom:50px;
}

.kick-player{
    width:95%;
    height:60vw;
    max-width:1280px;
    max-height:720px;
    border:none;
    display:block;
    margin:auto;
    box-shadow:0 0 30px rgba(0,0,0,.5);
}

.instagram{
    margin-top:40px;
    margin-bottom:60px;
}

.instagram a{
    color:white;
    text-decoration:none;
    letter-spacing:3px;
    opacity:.7;
    display:inline-flex;
    align-items:center;
    gap:10px;
}

@media (max-width:768px){

    body{
        padding-top:15px;
        background-size:cover;
        background-position:center;
    }

    .logo{
        width:42vw;
        max-width:180px;
        display:block;
        margin:0 auto;
    }

    .subtitle{
        font-size:9px;
        margin-top:-8px;
        margin-bottom:65px;
        letter-spacing:.25em;
    }

    .kick-player{
        width:92%;
        margin:0 auto;
        display:block;
    }

    .instagram{
        margin-top:8px;
        margin-bottom:15px;
    }

}

</style>
</head>

<body>

<img src="LOGO.png" class="logo">

<p class="subtitle">
late night sessions
</p>

<iframe
class="kick-player"
src="https://player.kick.com/bengallatenightsessions"
frameborder="0"
scrolling="no"
allowfullscreen="true">
</iframe>

<div class="instagram">

<a href="https://www.instagram.com/bengal__music/" target="_blank">

<svg xmlns="http://www.w3.org/2000/svg"
width="24"
height="24"
fill="white"
viewBox="0 0 24 24">

<path d="M7.75 2C4.574 2 2 4.574 2 7.75v8.5C2 19.426 4.574 22 7.75 22h8.5C19.426 22 22 19.426 22 16.25v-8.5C22 4.574 19.426 2 16.25 2h-8.5zm0 2h8.5A3.75 3.75 0 0 1 20 7.75v8.5A3.75 3.75 0 0 1 16.25 20h-8.5A3.75 3.75 0 0 1 4 16.25v-8.5A3.75 3.75 0 0 1 7.75 4zm8.75 1a1.25 1.25 0 1 0 0 2.5A1.25 1.25 0 0 0 16.5 5zM12 7a5 5 0 1 0 0 10a5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6a3 3 0 0 1 0-6z"/>

</svg>

<span>@bengal_music</span>

</a>

</div>

</body>
</html>
